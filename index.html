const on = "background:#2C5E4A;color:#FFFFFF;";
const off = "background:transparent;color:#1E2A22;";
function setLang(lang){
  const t = dict[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t[el.dataset.k]; });
  const es = document.getElementById('btn-es'), en = document.getElementById('btn-en');
  es.style.cssText = base + (lang==='es'?on:off); en.style.cssText = base + (lang==='en'?on:off);
  es.setAttribute('aria-pressed', lang==='es'); en.setAttribute('aria-pressed', lang==='en');
  const u = 'https://wa.me/5491170190079?text=' + encodeURIComponent(t.waMsg);
  document.getElementById('wa-btn').href = u; document.getElementById('wa-float').href = u;
  try { localStorage.setItem('lang', lang); } catch(e) {}
}
document.getElementById('btn-es').onclick = () => setLang('es');
document.getElementById('btn-en').onclick = () => setLang('en');
